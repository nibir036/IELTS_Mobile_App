name: nexted_ielts_app
description: "IELTS AI by nextED — IELTS preparation app (design build, demo data)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  http: ^1.2.2
  record: ^7.1.1
  just_audio: ^0.9.42
  cross_file: ^0.3.4
  path_provider: ^2.1.5
  share_plus: ^11.0.0
  image_picker: ^1.1.2
  flutter_tts: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/demo/demo_data.json
    - assets/content/reading_bank.json
    - assets/content/listening_bank.json
    - assets/content/writing_bank.json
    - assets/content/speaking_bank.json
    - assets/content/reading_guide.json
    - assets/content/writing_guide.json
    - assets/content/speaking_guide.json
    - assets/content/grammar_guide.json
    - assets/content/listening_guide.json
    - assets/content/vocab_guide.json
    - assets/content/resources_bank.json
    - assets/content/tests_bank.json
    - assets/content/l10n/
    - assets/content/l10n/bn/
    - assets/content/l10n/ne/
    - assets/content/l10n/ar/
    - assets/content/l10n/id/
    # Listening audio and the writing / reading / map images are in
    # Cloudflare R2 (lib/app/services/media.dart, server/scripts/upload-media.ts).
    - assets/audio/listening_placeholder.mp3
    - assets/audio/sound_check.mp3
    - assets/branding/ielts-ai-mascot-full.png
    - assets/branding/ielts-ai-mascot-full-dark.png
    - assets/branding/ielts-ai-mascot-full-light.png
    - assets/branding/ielts-ai-wordmark-dark.png
    - assets/branding/ielts-ai-wordmark-light.png

# App icon: put a 1024x1024 PNG (no transparency for iOS) at
# assets/branding/app_icon.png, then run:  dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/branding/app_icon.png"
  android: true
  # Android 8+ adaptive icon: pink→lavender background + "IELTS AI." mark in the safe zone
  adaptive_icon_background: "assets/branding/app_icon_background.png"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#F3D3E0"
    theme_color: "#151515"
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
