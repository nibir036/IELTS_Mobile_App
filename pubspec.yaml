name: nexted_ielts_app
description: "IELTS AI by nextED — IELTS preparation app (design build, demo data)."
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  http: ^1.2.2
  record: ^7.1.1
  just_audio: ^0.9.42
  cross_file: ^0.3.4
  path_provider: ^2.1.5
  share_plus: ^11.0.0
  image_picker: ^1.1.2
  # Study-abroad documents: PDF / JPG / PNG from the phone's files.
  file_picker: ^10.0.0
  flutter_tts: ^4.0.2
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.0
  video_player: ^2.9.2
  pointer_interceptor: ^0.10.1
  in_app_purchase: ^3.2.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    # UI text, bundled so the login screens work before any download. The
    # question banks, guides, courses and translations (assets/content/**)
    # are NOT bundled: the server serves them as content packs from its
    # database (server/src/lib/packs.ts) and the app keeps them on the phone
    # (lib/app/data/packs/content_packs.dart).
    - assets/demo/demo_data.json
    - assets/mascot/
    # Module card videos (Practice tab).
    - assets/videos/
    # Listening audio and the writing / reading / map images are in
    # Cloudflare R2 (lib/app/services/media.dart, server/scripts/upload-media.ts).
    - assets/audio/listening_placeholder.mp3
    - assets/audio/sound_check.mp3
    - assets/branding/ielts-ai-mascot-full.png
    - assets/branding/ielts-ai-mascot-full-dark.png
    - assets/branding/ielts-ai-mascot-full-light.png
    - assets/branding/ielts-ai-wordmark-dark.png
    - assets/branding/ielts-ai-wordmark-light.png

# App icon: put a 1024x1024 PNG (no transparency for iOS) at
# assets/branding/app_icon.png, then run:  dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/branding/app_icon.png"
  android: true
  # Android 8+ adaptive icon: the blue gradient + the nextED wordmark inside the safe zone.
  # Play Store listing icon (512x512): assets/branding/play_store_icon_512.png
  adaptive_icon_background: "assets/branding/app_icon_background.png"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#063195"
    theme_color: "#151515"
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
